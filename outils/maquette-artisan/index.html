:root{--k:#6E6B4E;--k2:#A9A47A;--t:#ECE6DC;--sand:#E3DFC4;--soft:#ECE6DC;--acc:#6E6B4E;--ink:#34331F;--mut:#8A8072;--line:#D9D1C2;--red:#34331F;--ok:#DDE5C9;--wait:#D9D1C2;--bg:#F6F2EA;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Calibri,sans-serif;color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{background:radial-gradient(500px 400px at 100% 0,rgba(169,164,122,.45),transparent 60%),var(--k);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
aside .art{position:absolute;right:-70px;bottom:-60px;width:230px;opacity:.14;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;position:relative}
.brand .lg{width:42px;height:42px;border-radius:12px;background:#fff;color:var(--k);display:grid;place-items:center;font:800 1.1rem 'Playfair Display',serif;flex:none}
.brand b{font:700 1.15rem/1.15 'Playfair Display',serif;display:block}.brand small{color:var(--sand);font-size:.74rem}
nav{display:flex;flex-direction:column;gap:3px;position:relative}
nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#fff;font:500 .93rem Inter;padding:11px 12px;border-radius:12px;cursor:pointer;text-align:left;transition:.2s}
nav button:hover{background:rgba(255,255,255,.12)}nav button.on{background:#fff;color:var(--k);font-weight:600}
nav button .ic{width:22px;text-align:center}nav button .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:.72rem;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;position:relative;font-size:.78rem;color:var(--sand)}
.who{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;margin-bottom:12px}
.who button{flex:1;border:0;border-radius:999px;padding:7px;font:600 .78rem Inter;cursor:pointer;background:transparent;color:#fff}.who button.on{background:#fff;color:var(--k)}
.themes{display:flex;gap:8px;margin:8px 0}.themes i{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid rgba(255,255,255,.7)}
main{padding:30px 3.5vw 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:clamp(1.9rem,3.6vw,2.8rem);font-weight:800;line-height:1.05}.head p{margin:6px 0 0;color:var(--mut)}
.demo{background:var(--soft);border-radius:999px;padding:6px 14px;font-size:.78rem;font-weight:600}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:16px}
.card h3{font-size:1.2rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}.card h3 small{font:500 .78rem Inter;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.k{background:var(--t);border-radius:20px;padding:16px 20px;position:relative;overflow:hidden}
.k small{display:block;color:var(--mut);font-weight:500}.k b{font:800 2.1rem/1.1 'Playfair Display',serif;display:block;margin-top:4px}
.k.main{background:var(--k);color:#fff}.k.main small{color:var(--sand)}
.k.al{box-shadow:inset 0 -4px 0 var(--red)}.k em{position:absolute;right:16px;top:14px;font-style:normal;color:var(--red);font-weight:800;font-size:1.3rem}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:6px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:.75rem;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:10px 10px 4px 4px;transition:height .6s var(--ease)}.bars div:last-child i{background:var(--k)}.bars b{font-size:.75rem;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--t);border-radius:14px;padding:11px 15px;margin-bottom:8px;cursor:default}
.row.click{cursor:pointer;transition:.2s}.row.click:hover{transform:translateX(3px);background:var(--soft)}
.row small{display:block;color:var(--mut)}.row b{font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.78rem;font-weight:600;background:var(--soft);white-space:nowrap}
.pill.ok{background:var(--k);color:#fff}.pill.late{background:var(--ink);color:#fff}.pill.wait{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--k)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips button{border:1.5px solid var(--k);background:#fff;color:var(--k);border-radius:999px;padding:6px 16px;font:600 .82rem Inter;cursor:pointer}.chips button.on{background:var(--k);color:#fff}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--k);box-shadow:0 0 0 3px rgba(110,107,78,.18)}textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:.78rem;font-weight:600;margin-bottom:10px}label.f span{display:block;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.btn{border:0;border-radius:999px;padding:10px 20px;font:600 .88rem Inter;cursor:pointer;background:var(--k);color:#fff;transition:.2s}.btn:hover{background:var(--ink)}.btn.ghost{background:#fff;color:var(--k);box-shadow:inset 0 0 0 1.5px var(--k)}
table{width:100%;border-collapse:collapse}th{text-align:left;font:700 .72rem Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr.late td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--k);background:#fff;cursor:pointer;display:inline-grid;place-items:center;color:#fff;font-size:.8rem;transition:.2s;vertical-align:middle}.cb.on{background:var(--k)}
.bang{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:.78rem;margin-right:6px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding:4px}
.bub{max-width:78%;padding:10px 15px;border-radius:18px;line-height:1.4}.bub small{display:block;font-size:.72rem;opacity:.75;margin-bottom:2px}
.bub.me{background:var(--k);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}.bub.you{background:var(--t);align-self:flex-start;border-bottom-left-radius:4px}
.compose{display:flex;gap:10px;margin-top:12px}.compose input{flex:1}
.prog{height:10px;background:var(--t);border-radius:6px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--k);border-radius:6px}
.chg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tk{display:flex;align-items:center;gap:12px;background:var(--t);border-radius:14px;padding:11px 15px;margin-bottom:8px}.tk.done span:not(.cb){text-decoration:line-through;color:var(--mut)}.tk.late{box-shadow:inset 3px 0 0 var(--red)}.tk span:not(.cb){flex:1}.tk .cb{flex:none}
.view{display:none}.view.on{display:block;animation:in .4s var(--ease)}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:24px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.card{overflow-x:auto}aside{position:relative;top:auto;height:auto;padding:14px}.side-foot{display:none}nav{flex-direction:row;overflow:auto}nav button{white-space:nowrap}.kp{grid-template-columns:1fr 1fr}.two,.g2{grid-template-columns:1fr}main{padding:20px 16px 60px}table{font-size:.85rem}.hide-m{display:none}}

 {id:4,n:'Marie Leroy',t:'part',s:'Particulier',c:'Marie Leroy',tel:'06 11 22 33 44',em:'marie.leroy@mail.fr',adr:'Chemin de Cala Rossa, Lecci',note:'Villa en travaux, tableau électrique à refaire.'},
 {id:5,n:'Paul Santoni',t:'part',s:'Particulier',c:'Paul Santoni',tel:'06 55 44 33 22',em:'',adr:'Bastelicaccia',note:''},
 {id:6,n:'Syndic Les Oliviers',t:'pro',s:'Copropriété',c:'M. Antonetti',tel:'04 95 70 11 22',em:'syndic@lesoliviers.fr',adr:'Porto-Vecchio',note:'Une facture par résidence.'}];
const invoices=[
 {id:'F-041',c:3,a:420,d:D(-12),e:D(18),paid:null},
 {id:'F-040',c:2,a:2860,d:D(-40),e:D(-10),paid:null},
 {id:'F-039',c:1,a:1450,d:D(-60),e:D(-15),paid:null},
 {id:'F-038',c:4,a:980,d:D(-35),e:D(-5),paid:D(-3)},
 {id:'F-037',c:6,a:640,d:D(-50),e:D(-20),paid:D(-25)},
 {id:'F-036',c:5,a:180,d:D(-70),e:D(-40),paid:D(-38)},
 {id:'F-035',c:2,a:1900,d:D(-90),e:D(-60),paid:D(-70)}];
const quotes=[{id:'D-018',c:4,a:3200,s:'Envoyé'},{id:'D-017',c:2,a:5400,s:'Accepté'},{id:'D-016',c:6,a:1250,s:'Refusé'}];
const relances=[
 {inv:'F-040',d:D(-3),by:'Sabrina',ch:'Email',txt:'1re relance envoyée à M. Leoni'},
 {inv:'F-039',d:D(-8),by:'Sabrina',ch:'Email',txt:'1re relance envoyée'},
 {inv:'F-039',d:D(-2),by:'Sabrina',ch:'Téléphone',txt:'Mme Ferrari : mandat en cours, paiement prévu sous 10 jours'}];
const msgs=[
 {by:'client',d:D(-3),t:'La mairie de Zonza s\'engage à régler d\'ici le 28.'},
 {by:'sab',d:D(-3),t:'Noté. Je relance le lendemain si rien n\'est reçu.'},
 {by:'client',d:D(-1),t:'Pouvez-vous relancer l\'Hôtel Marina Bianca sur la F-040 ? Je viens de les avoir sur le chantier.'},
 {by:'sab',d:D(-1),t:'C\'est fait, relance partie ce matin. Je vous tiens au courant.'}];
const tasks=[
 {t:'Relancer la mairie de Zonza (F-039)',d:D(-4),done:false,own:'Sabrina'},
 {t:'Envoyer le devis à Marie Leroy',d:D(0),done:false,own:'Vous'},
 {t:'Préparer les pièces du mois pour le comptable',d:D(3),done:false,own:'Sabrina'},
 {t:'Commander le matériel du chantier Marina Bianca',d:D(0),done:true,own:'Vous'}];
const chantiers=[
 {n:'Mise aux normes — Hôtel Marina Bianca',c:2,adr:'Route de la Marine',p:70,ac:'Acompte de 30 % reçu'},
 {n:'Tableau électrique — Villa Leroy',c:4,adr:'Cala Rossa, Lecci',p:25,ac:'Acompte demandé'},
 {n:'Éclairage extérieur — Syndic Les Oliviers',c:6,adr:'Résidence Les Oliviers',p:100,ac:'Terminé, facturé'}];
const cl=id=>clients.find(c=>c.id===id);
const late=i=>!i.paid&&i.e<TODAY;
const NAV=[['dash','▦','Tableau de bord'],['cli','☺','Clients'],['fac','€','Devis et factures'],['rel','↻','Relances'],['msg','✉','Messages'],['tas','✓','Tâches du jour'],['cha','⌂','Chantiers']];
let cur='dash',selCli=null,flt='all',q='';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900)}
function badge(id){if(id==='fac')return invoices.filter(late).length;if(id==='tas')return tasks.filter(t=>!t.done&&t.d<TODAY).length;return 0}
function nav(){$('#nav').innerHTML=NAV.map(n=>{const b=badge(n[0]);return `<button data-v="${n[0]}" class="${cur===n[0]?'on':''}"><span class="ic">${n[1]}</span>${n[2]}${b?`<span class="bd">${b}</span>`:''}</button>`}).join('')}
const monthsLabels=()=>{const a=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);a.push(d.toLocaleDateString('fr-FR',{month:'short'}))}return a};
function caMois(){const m=TODAY.slice(0,7);return invoices.filter(i=>i.paid&&i.paid.slice(0,7)===m).reduce((a,i)=>a+i.a,0)}
function dash(){
 const pend=invoices.filter(i=>!i.paid),lt=invoices.filter(late);
 const hist=[2100,2650,1900,3100,2400,caMois()||1];const mx=Math.max(...hist);const ml=monthsLabels();
 return `<div class="kp"><div class="k main"><small>Chiffre d'affaires du mois</small><b>${eur(caMois())}</b></div><div class="k"><small>Clients professionnels</small><b>${clients.filter(c=>c.t==='pro').length}</b></div><div class="k"><small>Clients particuliers</small><b>${clients.filter(c=>c.t==='part').length}</b></div><div class="k ${lt.length?'al':''}">${lt.length?'<em>!</em>':''}<small>Factures en attente</small><b>${pend.length}</b><small>${eur(pend.reduce((a,i)=>a+i.a,0))} à encaisser · ${lt.length} en retard</small></div></div>
 <div class="two"><div class="card"><h3>Chiffre d'affaires<small>6 derniers mois</small></h3><div class="bars">${hist.map((v,i)=>`<div><b>${eur(v)}</b><i style="height:${Math.max(6,v/mx*100)}%"></i>${ml[i]}</div>`).join('')}</div></div>
 <div class="card"><h3>À faire<small>aujourd'hui</small></h3>${tasks.filter(t=>!t.done).slice(0,3).map(t=>`<div class="tk ${t.d<TODAY?'late':''}"><span>${t.d<TODAY?'<b class="bang">!</b>':''}${esc(t.t)}</span><small>${t.d<TODAY?'En retard ! · ':''}${fd(t.d)}</small></div>`).join('')||'<p style="color:var(--mut)">Rien d\'urgent.</p>'}</div></div>
 <div class="two"><div class="card"><h3>Dernières relances<small>faites par Sabrina</small></h3>${relances.slice().reverse().slice(0,3).map(r=>`<div class="row"><div><b>${r.inv} · ${esc(cl(invoices.find(i=>i.id===r.inv).c).n)}</b><small>${fd(r.d)} · ${r.ch} · ${esc(r.txt)}</small></div></div>`).join('')}</div>
 <div class="card"><h3>Messages<small>derniers échanges</small></h3>${msgs.slice(-2).map(m=>`<div class="row"><div><b>${m.by==='sab'?'Sabrina':'Vous'} · ${fd(m.d)}</b><small>${esc(m.t)}</small></div></div>`).join('')}</div></div>`}
function cliList(){const L=clients.filter(c=>(flt==='all'||c.t===flt)&&c.n.toLowerCase().includes(q.toLowerCase()));
 return `<div class="card"><input type="text" id="srch" placeholder="Rechercher un client…" value="${esc(q)}" style="margin-bottom:12px"><div class="chips">${[['all','Tous'],['pro','Professionnels'],['part','Particuliers']].map(a=>`<button data-f="${a[0]}" class="${flt===a[0]?'on':''}">${a[1]}</button>`).join('')}<button class="btn ghost" id="newcli" style="margin-left:auto">+ Nouveau client</button></div><div id="clist">${L.map(c=>{const iv=invoices.filter(i=>i.c===c.id);const st=iv.some(late)?'<span class="pill late">! À relancer</span>':iv.some(i=>!i.paid)?'<span class="pill wait">En attente</span>':iv.length?'<span class="pill ok">À jour</span>':'<span class="pill">Nouveau</span>';return `<div class="row click" data-c="${c.id}"><div><b>${esc(c.n)}</b><small>${esc(c.s)}</small></div>${st}</div>`}).join('')||'<p style="color:var(--mut)">Aucun client.</p>'}</div></div>`}
function cliFiche(c){const iv=invoices.filter(i=>i.c===c.id);
 return `<button class="btn ghost" data-back style="margin-bottom:14px">← Tous les clients</button><div class="card"><h3>${esc(c.n)}<small>${esc(c.s)}</small></h3><div class="g2"><label class="f"><span>Contact</span><input type="text" data-cf="c" value="${esc(c.c)}"></label><label class="f"><span>Téléphone</span><input type="tel" data-cf="tel" value="${esc(c.tel)}"></label><label class="f"><span>Email</span><input type="email" data-cf="em" value="${esc(c.em)}"></label><label class="f"><span>Adresse</span><input type="text" data-cf="adr" value="${esc(c.adr)}"></label></div><label class="f"><span>Notes</span><textarea data-cf="note">${esc(c.note)}</textarea></label></div>
 <div class="card"><h3>Factures de ce client</h3>${iv.map(i=>`<div class="row"><div><b>${i.id} · ${eur(i.a)}</b><small>échéance ${fd(i.e)}</small></div>${i.paid?'<span class="pill ok">Réglée</span>':late(i)?'<span class="pill late">En retard !</span>':'<span class="pill wait">En attente</span>'}</div>`).join('')||'<p style="color:var(--mut)">Aucune facture.</p>'}</div>`}
function fac(){
 return `<div class="card"><h3>Factures<small>cochez « réglée » dès que vous recevez le paiement</small></h3><table><thead><tr><th>N°</th><th>Client</th><th class="hide-m">Échéance</th><th>Montant</th><th>État</th><th>Réglée</th></tr></thead><tbody>${invoices.map(i=>`<tr class="${late(i)?'late':''}"><td><b>${i.id}</b></td><td>${esc(cl(i.c).n)}</td><td class="hide-m">${fd(i.e)}</td><td>${eur(i.a)}</td><td>${i.paid?'<span class="pill ok">Réglée</span>':late(i)?'<span class="pill late"><b class="bang" style="width:16px;height:16px;font-size:.65rem">!</b>En retard</span>':'<span class="pill wait">En attente</span>'}</td><td><span class="cb ${i.paid?'on':''}" data-pay="${i.id}" role="checkbox" aria-checked="${!!i.paid}" tabindex="0">${i.paid?'✓':''}</span></td></tr>`).join('')}</tbody></table></div>
 <div class="card"><h3>Devis</h3>${quotes.map(d=>`<div class="row"><div><b>${d.id} · ${esc(cl(d.c).n)}</b><small>${eur(d.a)}</small></div><span class="pill ${d.s==='Accepté'?'ok':d.s==='Refusé'?'late':'wait'}">${d.s}</span></div>`).join('')}</div>`}
function rel(){
 return `<div class="card"><h3>Historique des relances<small>chaque action est datée</small></h3>${invoices.filter(i=>!i.paid).map(i=>{const R=relances.filter(r=>r.inv===i.id);return `<div style="margin-bottom:16px"><div class="row" style="background:var(--sand)"><div><b>${i.id} · ${esc(cl(i.c).n)}</b><small>${eur(i.a)} · échéance ${fd(i.e)}</small></div>${late(i)?'<span class="pill late">En retard !</span>':'<span class="pill wait">En attente</span>'}</div>${R.map(r=>`<div class="row" style="margin-left:22px"><div><b>${fd(r.d)} · ${r.ch}</b><small>${esc(r.txt)} — ${r.by==='Sabrina'?'Sabrina':'Vous'}</small></div></div>`).join('')||'<p style="margin-left:22px;color:var(--mut)">Pas encore de relance.</p>'}<div style="margin-left:22px"><button class="btn ghost" data-addrel="${i.id}" style="padding:6px 14px;font-size:.8rem">+ Noter une relance</button></div></div>`}).join('')}</div>`}
function msg(){return `<div class="card"><h3>Messagerie partagée<small>entre ${who==='sab'?'vous et le client':'vous et Sabrina'}</small></h3><div class="chat" id="chat">${msgs.map(m=>{const mine=(m.by==='sab')===(who==='sab');return `<div class="bub ${mine?'me':'you'}"><small>${m.by==='sab'?'Sabrina':'Client'} · ${fd(m.d)}</small>${esc(m.t)}</div>`}).join('')}</div><div class="compose"><input type="text" id="mi" placeholder="Écrire un message…"><button class="btn" id="ms">Envoyer</button></div></div>`}
function tas(){return `<div class="card"><h3>Tâches du jour<small>${tasks.filter(t=>t.done).length} faites · ${tasks.filter(t=>!t.done).length} à faire</small></h3>${tasks.map((t,i)=>`<div class="tk ${t.done?'done':''} ${!t.done&&t.d<TODAY?'late':''}"><span class="cb ${t.done?'on':''}" data-tk="${i}" role="checkbox" aria-checked="${t.done}" tabindex="0">${t.done?'✓':''}</span><span>${!t.done&&t.d<TODAY?'<b class="bang">!</b>':''}${esc(t.t)}<small style="display:block;color:var(--mut)">${t.own} · ${!t.done&&t.d<TODAY?'En retard ! · ':''}${fd(t.d)}</small></span></div>`).join('')}<div class="compose"><input type="text" id="ti" placeholder="Ajouter une tâche…"><button class="btn" id="ta">Ajouter</button></div></div>`}
function cha(){return `<div class="chg">${chantiers.map(h=>`<div class="card"><h3>${esc(h.n)}</h3><small style="color:var(--mut)">${esc(cl(h.c).n)} · ${esc(h.adr)}</small><div class="prog"><i style="width:${h.p}%"></i></div><b>${h.p} %</b> d'avancement<br><span class="pill" style="margin-top:8px">${esc(h.ac)}</span></div>`).join('')}</div>`}
const TITLES={dash:['Bonjour 👋','Voici où en est votre activité.'],cli:['Vos clients','Une fiche par client, à retrouver en un clic.'],fac:['Devis et factures','Réglées ou non, en un coup d\'œil.'],rel:['Relances','Ce que Sabrina a fait, et où on en est.'],msg:['Messagerie','Un échange simple entre vous et Sabrina.'],tas:['Tâches du jour','Ce qu\'il y a à faire, sans rien oublier.'],cha:['Chantiers','Avancement et acomptes.']};
function render(){nav();const t=TITLES[cur];$('#ttl').textContent=cur==='dash'?'Bonjour 👋':t[0];$('#sub').textContent=t[1];
 const v=cur==='dash'?dash():cur==='cli'?(selCli?cliFiche(cl(selCli)):cliList()):cur==='fac'?fac():cur==='rel'?rel():cur==='msg'?msg():cur==='tas'?tas():cha();
 $('#views').innerHTML='<div class="view on">'+v+'</div>';const c=$('#chat');if(c)c.scrollTop=c.scrollHeight}
const THEMES={kaki:['#6E6B4E','#A9A47A','#ECE6DC','#E3DFC4','#34331F','#F6F2EA','#ECE6DC','#6E6B4E'],bleu:['#8A7F6B','#B5AB98','#EEE9E0','#E3DFC4','#34331F','#F7F4EE','#EEE9E0','#8A7F6B'],rouge:['#4A4A44','#8F8F86','#ECE9E4','#DEDCD6','#2B2B27','#F5F4F1','#ECE9E4','#4A4A44'],vert:['#4F4D38','#8E8B6B','#E9E5D9','#DAD6C2','#2A2A1A','#F4F2EA','#E9E5D9','#4F4D38']};
function theme(n){const t=THEMES[n],r=document.documentElement.style;['--k','--k2','--t','--sand','--ink','--bg','--soft','--acc'].forEach((k,i)=>r.setProperty(k,t[i]))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-v],[data-f],[data-c],[data-back],[data-pay],[data-tk],[data-w],[data-th],[data-addrel],#newcli,#ms,#ta');if(!t)return;
 if(t.dataset.v){cur=t.dataset.v;selCli=null;render();return}
 if(t.dataset.f){flt=t.dataset.f;render();return}
 if(t.dataset.c){selCli=+t.dataset.c;render();return}
 if(t.dataset.back!=null){selCli=null;render();return}
 if(t.dataset.pay){const i=invoices.find(x=>x.id===t.dataset.pay);i.paid=i.paid?null:TODAY;toast(i.paid?i.id+' marquée réglée. Le tableau de bord est à jour.':i.id+' remise en attente');render();return}
 if(t.dataset.tk!=null){const k=tasks[+t.dataset.tk];k.done=!k.done;render();return}
 if(t.dataset.w){who=t.dataset.w;document.querySelectorAll('#who button').forEach(b=>b.classList.toggle('on',b.dataset.w===who));render();toast(who==='sab'?'Vue de Sabrina : elle saisit et relance':'Vue du client');return}
 if(t.dataset.th){theme(t.dataset.th);toast('L\'outil prend les couleurs du client');return}
 if(t.dataset.addrel){relances.push({inv:t.dataset.addrel,d:TODAY,by:who==='sab'?'Sabrina':'Client',ch:'Email',txt:'Relance notée'});toast('Relance notée, avec la date du jour');render();return}
 if(t.id==='newcli'){const n=clients.length+1;clients.push({id:n,n:'Nouveau client '+n,t:'pro',s:'À compléter',c:'',tel:'',em:'',adr:'',note:''});selCli=n;render();toast('Fiche créée : à remplir');return}
 if(t.id==='ms'){const i=$('#mi');if(i.value.trim()){msgs.push({by:who==='sab'?'sab':'client',d:TODAY,t:i.value.trim()});render()}return}
 if(t.id==='ta'){const i=$('#ti');if(i.value.trim()){tasks.push({t:i.value.trim(),d:TODAY,done:false,own:who==='sab'?'Sabrina':'Vous'});render()}return}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='srch'){q=t.value;const p=t.selectionStart;render();const s=$('#srch');s.focus();s.setSelectionRange(p,p)}
 if(t.dataset.cf&&selCli){const c=cl(selCli);c[t.dataset.cf]=t.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='mi')$('#ms').click();if(e.target.id==='ti')$('#ta').click()}if((e.key===' '||e.key==='Enter')&&e.target.classList&&e.target.classList.contains('cb')){e.preventDefault();e.target.click()}});
render();
</script></body></html>
