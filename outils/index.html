*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,Calibri,sans-serif;color:var(--ink);background:#fff;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;margin:0}
.top{background:radial-gradient(900px 600px at 85% 10%,rgba(169,164,122,.5),transparent 62%),radial-gradient(700px 500px at 0% 110%,rgba(52,51,31,.5),transparent 62%),var(--k);color:#fff;position:relative;overflow:hidden;padding:34px 6vw 26px}
.top .art{position:absolute;right:-40px;bottom:-80px;width:420px;opacity:.2;pointer-events:none}
.top .in{position:relative;max-width:1180px;margin:0 auto}
.top .bar{display:flex;align-items:baseline;gap:18px}.top .bar b{font:800 clamp(3.4rem,8vw,6.2rem)/.95 'Playfair Display',serif}
.top .bar small{font:500 .78rem Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);margin-left:10px}
.top h1{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:700;line-height:1.2;margin-top:10px}
.top .tagl{font-style:italic;color:var(--sand);font-size:1.15rem;margin-top:8px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.steps button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:#fff;border-radius:999px;padding:9px 16px;font:600 .85rem Inter;cursor:pointer;backdrop-filter:blur(6px);transition:.25s var(--ease);display:inline-flex;gap:8px;align-items:center}
.steps button b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);font-size:.75rem}
.steps button:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
.steps button.on{background:#fff;color:var(--k);border-color:#fff}.steps button.on b{background:var(--k);color:#fff}
.ribbon{background:var(--ink);color:var(--sand);padding:10px 6vw;font-size:.85rem;font-weight:600;display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.ribbon span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--k2);margin-right:10px;vertical-align:middle}
main{max-width:1180px;margin:0 auto;padding:40px 5vw 90px}
.lab{font:600 .78rem Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--k);display:flex;align-items:center;gap:12px;margin-bottom:8px}
.lab::before{content:"";width:28px;height:2px;background:currentColor;border-radius:2px}
.big{font-size:clamp(2rem,4.4vw,3.2rem);font-weight:800;line-height:1.06}
.sub{color:var(--mut);max-width:680px;margin:12px 0 26px}
.view{display:none}.view.on{display:block;animation:in .5s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--t);border-radius:22px;padding:24px 26px;margin-bottom:18px}
.card.w{background:#fff;border:1px solid var(--line)}
.card>h3{font-size:1.4rem;margin-bottom:4px}
.card>p.s{color:var(--mut);margin:0 0 14px;font-size:.92rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 18px}
.full{grid-column:1/-1}
label.f{display:block;font-size:.8rem;font-weight:600}
label.f span{display:block;margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;font-size:.92rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--k);box-shadow:0 0 0 3px rgba(110,107,78,.18)}
input[type=color]{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;padding:2px;background:#fff}
button.btn,a.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font:600 .92rem Inter;cursor:pointer;background:var(--k);color:#fff;transition:.25s var(--ease);text-decoration:none}
button.btn:hover{background:var(--ink);transform:translateY(-1px)}
button.btn.ghost{background:#fff;color:var(--k);box-shadow:inset 0 0 0 1.5px var(--k)}button.btn.ghost:hover{background:var(--t)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.hint{background:var(--soft);border-radius:14px;padding:11px 16px;font-size:.88rem;margin:0 0 16px}
.need{display:grid;grid-template-columns:1fr 150px 90px;gap:10px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.need.off{opacity:.55}
.need .nm{display:flex;gap:12px;align-items:center;font-weight:600}
.need .nm small{display:block;font-weight:400;color:var(--mut)}
.need .pk{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--k);border-radius:10px;padding:2px 8px;margin-left:8px;font-weight:700}
.need input[type=checkbox]{width:20px;height:20px;accent-color:var(--k)}
.need select,.need input[type=number]{padding:7px 9px}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--k);color:#fff;border-radius:20px;padding:18px 24px;margin-top:14px}
.sum b{font:800 2rem 'Playfair Display',serif}.sum small{display:block;color:var(--sand)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:26px;position:relative;display:flex;flex-direction:column;transition:.3s var(--ease)}
.plan.rec{border-color:var(--k);box-shadow:0 26px 50px -30px rgba(52,51,31,.55);transform:translateY(-4px)}
.plan .rb{position:absolute;top:-13px;left:22px;background:var(--k);color:#fff;border-radius:999px;padding:4px 14px;font:700 .72rem Inter;letter-spacing:.1em;text-transform:uppercase}
.plan h3{font-size:1.7rem}.plan .pr{font:800 2.6rem 'Playfair Display',serif;color:var(--k);margin:6px 0 0;line-height:1}
.plan .pr small{font:500 .9rem Inter;color:var(--mut)}
.plan .hh{color:var(--mut);margin:4px 0 14px;font-size:.9rem}
.plan ul{list-style:none;padding:0;margin:0 0 16px;flex:1}
.plan li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--t);font-size:.92rem;align-items:flex-start}
.plan li i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--k);color:#fff;display:grid;place-items:center;font-size:.72rem;font-style:normal;margin-top:1px}
.plan li.no i{background:var(--t);color:var(--mut)}.plan li.no{color:var(--mut)}
.plan li.need-yes{font-weight:600}
.plan .pick{margin-top:auto}
.cmp{background:var(--t);border-radius:18px;padding:14px 20px;margin-bottom:22px;display:flex;gap:22px;flex-wrap:wrap}
.cmp div{font-size:.9rem}.cmp b{display:block;font:800 1.3rem 'Playfair Display',serif;color:var(--k)}
.cmp .win b{color:var(--ink)}.cmp .win{border-bottom:3px solid var(--k)}
.toolpick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.tp{border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;background:#fff;cursor:pointer;transition:.25s}
.tp.on{border-color:var(--k);background:var(--k);color:#fff}.tp.on small{color:var(--sand)}.tp.on span{color:#fff!important}.tp b{font:700 1.15rem 'Playfair Display',serif;display:block}
.tp small{color:var(--mut);display:block;margin-top:4px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 58px 78px 22px;gap:6px;margin-bottom:8px}.ln input{padding:9px 8px}
.ln button{border:0;background:transparent;color:var(--mut);font-size:1.2rem;cursor:pointer}

 async tx(m,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('f',m);const r=fn(t.objectStore('f'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
 put(id,b){return this.tx('readwrite',s=>s.put(b,id))},get(id){return this.tx('readonly',s=>s.get(id))},del(id){return this.tx('readwrite',s=>s.delete(id))}};

 }

 h+=sec(N(),'Documents à signer',`<table class="kv">${R.map(x=>`<tr><td style="width:8mm;color:var(--k);font-size:4.5mm">${x.st==='Signé'?'☑':'☐'}</td><td style="width:auto;color:inherit"><b>${esc(x.t)}</b><br><span style="color:var(--mut)">${esc(x.d)}</span></td></tr>`).join('')}</table>`);

 <div class="sign" style="display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:5mm"><div class="bk" style="min-height:34mm"><h4>Le client</h4>Nom : ${esc(V('contact')||'')}<br>Date :<br>Signature précédée de « Lu et approuvé, bon pour accord »</div><div class="bk" style="min-height:34mm"><h4>Respirà</h4>Sabrina Castelli<br>Date :<br>Signature</div></div></div>`;
